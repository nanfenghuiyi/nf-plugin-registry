# NF Client 插件市场 API — Cloudflare Workers 配置
# 部署前置步骤：
#   1. npx wrangler d1 create nf-market-stats      # 将输出的 database_id 替换下方占位符
#   2. npx wrangler d1 migrations apply DB --remote
#   3. npx wrangler deploy
name = "nf-market-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[observability]
enabled = true

[vars]
GITHUB_OWNER = "nanfenghuiyi"
GITHUB_REPO = "nf-plugin-registry"
GITHUB_BRANCH = "main"
# registry.json isolate 内存缓存 TTL（秒）
REGISTRY_CACHE_TTL_SECONDS = "300"

# ---- 阶段 3（开发者门户）vars：非敏感项；secrets 用 `npx wrangler secret put` 配置 ----
GH_CLIENT_ID = ""
ADMIN_GITHUB_LOGINS = ""
# 门户 Pages 域名（部署后回填；CORS 凭据白名单 + 登录回跳）
PORTAL_ORIGIN = ""
# 客户端 OAuth 深链回调
CLIENT_DEEP_LINK = "nf-client://auth/callback"
# secrets（不在本文件）：GH_CLIENT_SECRET / COOKIE_SECRET

# 待发布包体存储（publish 上传的 zip，≤20MB；KV 免费额度）
[[kv_namespaces]]
binding = "KV"
id = "195de33e48e244d9b19ecb1644c56f1e"

[[d1_databases]]
binding = "DB"
database_name = "plugin-registry"
database_id = "b5dc90bd-de74-415b-ba39-29d81bb4f148"
migrations_dir = "migrations"

# 速率限制 binding（open beta）：/api/* 全局 100 次/分/IP
[[unsafe.bindings]]
name = "RATE_LIMITER_API"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 100, period = 60 }

# 速率限制 binding：/api/download 单独收紧到 30 次/分/IP
[[unsafe.bindings]]
name = "RATE_LIMITER_DOWNLOAD"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }