# NF Client 插件市场 API 自动部署（阶段 2 / 阶段 3）
# 前置（仓库 Secrets）：
#   - CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID：部署 Worker + 应用 D1 迁移
# 前置（Worker 运行时 Secret，需 `npx wrangler secret put` 配置，勿入仓库）：
#   - GH_CLIENT_SECRET：GitHub OAuth App 客户端密钥
#   - COOKIE_SECRET：会话 cookie 签名密钥（HMAC）
# 说明：阶段 3 采用「两段式发布」，审批通过后的 registry 合入由核心成员本地
#       `nf-plugin-cli release --drain` 完成（根私钥不上云），Worker 本身不需要 GITHUB_PAT。
#       wrangler.toml 中的非敏感 vars（GH_CLIENT_ID / ADMIN_GITHUB_LOGINS / PORTAL_ORIGIN 等）
#       部署后请在 Cloudflare 控制台回填真实值。
name: Deploy Market API

on:
  push:
    branches: [main]
    paths:
      - 'market-api/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply D1 migrations (remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: market-api
          command: d1 migrations apply DB --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: market-api
          command: deploy